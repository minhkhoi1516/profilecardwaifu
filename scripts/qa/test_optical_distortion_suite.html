<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MinKoi V5.1 Optical Distortion Test Bed</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: #090b10;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* HIGH-CONTRAST OPTICAL TEST BED */
.test-stage {
    position: relative;
    width: 800px;
    height: 400px;
    background-color: #0d1117;
    /* 1. Checkerboard */
    background-image: 
        linear-gradient(45deg, #1c2128 25%, transparent 25%), 
        linear-gradient(-45deg, #1c2128 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1c2128 75%), 
        linear-gradient(-45deg, transparent 75%, #1c2128 75%);
    background-size: 40px 40px;
    background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
    border: 2px solid #30363d;
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 2. Grid lines */
.grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.35) 1px, transparent 1px);
    background-size: 20px 20px;
}

/* 3. High-Contrast Diagonal Calibrator Line */
.diagonal-calibrator {
    position: absolute;
    width: 900px;
    height: 4px;
    background: #f43f5e;
    transform: rotate(20deg);
    box-shadow: 0 0 10px #f43f5e;
}

/* 4. High-Contrast Typography */
.test-typography {
    position: absolute;
    top: 170px;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #38bdf8;
    text-shadow: 0 0 12px rgba(0,0,0,0.9);
    white-space: nowrap;
}

/* Refractive Liquid Lens */
.liquid-lens-element {
    position: absolute;
    width: 260px;
    height: 72px;
    border-radius: 9999px;
    top: 164px;
    left: 270px;
    z-index: 10;
    
    /* TRUE OPTICAL BACKDROP REFRACTION */
    backdrop-filter: url(#minkoi-liquid-lens-refraction);
    -webkit-backdrop-filter: url(#minkoi-liquid-lens-refraction);
    
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.65);
    box-shadow:
        inset 0 2px 2px 0 rgba(255, 255, 255, 0.75),
        inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.35),
        0 10px 28px -4px rgba(56, 189, 248, 0.45);
}

.lens-specular {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 25%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.15) 35%, transparent 70%);
}

.lens-dispersion {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: 
        inset 2.5px 0 3px -1px rgba(56, 189, 248, 0.55),
        inset -2.5px 0 3px -1px rgba(251, 191, 36, 0.50);
}

/* Control toggle class to hide lens */
.no-lens .liquid-lens-element {
    display: none !important;
}

/* Non-refractive flat overlay (blur only) for comparative control */
.flat-overlay .liquid-lens-element {
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
}
</style>
</head>
<body>
<div class="test-stage" id="stage">
    <div class="grid-overlay"></div>
    <div class="diagonal-calibrator"></div>
    <div class="test-typography">REFRACTION MATRIX 5.1</div>
    <div class="liquid-lens-element" id="lens">
        <div class="lens-dispersion"></div>
        <div class="lens-specular"></div>
    </div>
</div>

<svg width="0" height="0" style="position:absolute; pointer-events: none;" aria-hidden="true">
  <filter id="minkoi-liquid-lens-refraction" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.016" numOctaves="1" result="coarse_noise" />
    <feGaussianBlur in="coarse_noise" stdDeviation="4.5" result="smooth_gradient" />
    <feDisplacementMap in="SourceGraphic" in2="smooth_gradient" scale="16" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>
</body>
</html>
