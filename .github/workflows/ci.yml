name: Repository and Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install QA dependencies only
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify Production Deploy Allowlist
        run: node scripts/qa/verify-deploy-allowlist.cjs

      - name: Verify Zen compositor and paused background renderers
        run: node scripts/qa/verify-zen-compositor.cjs

      - name: Syntax, CSS, assets, catalogue and metadata
        run: pnpm qa:integrity
      - name: Real browser regression tests
        run: pnpm test:ui
      - name: Capture unapproved preview candidates
        run: |
          node scripts/qa/server.cjs &
          curl --retry 10 --retry-delay 1 --retry-connrefused --silent --fail http://127.0.0.1:8080/ > /dev/null
          node scripts/qa/capture-previews.cjs
          pnpm qa:previews
      - name: Upload evidence for review (never overwrite official previews)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qa-evidence
          path: test-results/
          retention-days: 14
